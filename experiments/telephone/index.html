<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pit Telephone</title><style>body{background:#101923;color:#edf2f6;font:16px system-ui;margin:0}main{max-width:540px;margin:auto;padding:24px}textarea,input{width:100%;box-sizing:border-box;background:#1a2937;border:1px solid #496071;border-radius:9px;color:white;padding:12px;font:inherit}textarea{min-height:130px}button{background:#37566a;color:white;border:1px solid #668499;border-radius:9px;padding:12px;font:inherit}button:disabled{opacity:.4}p,small{color:#a8b9c5}section{margin:24px 0}#status{white-space:pre-wrap}</style><main><h1>☎ Pit Telephone</h1><p>Type speech into a telephone call. Connection required; no telephone service is configured yet.</p><section><label>Telephone backend URL<input id="endpoint" placeholder="https://your-project.supabase.co/functions/v1/pit-phone"></label><p><small>Use a secured backend that owns the telephony credentials. Never put Twilio secrets in this page.</small></p></section><section><label>Number to call<input id="number" type="tel" placeholder="+1…"></label><p><button id="call">Place call</button> <button id="hangup" disabled>Hang up</button></p></section><section><label>Words to speak<textarea id="words">Welcome to hell.</textarea></label><p><button id="send" disabled>Speak into call</button></p></section><p id="status" role="status">Not connected. Set up a telephony backend to enable calls.</p><script>
const $=x=>document.getElementById(x);let callId=null;
async function request(action,data={}){const base=$('endpoint').value.trim().replace(/\/$/,'');if(!/^https:\/\//.test(base))throw Error('Enter an HTTPS backend URL');const r=await fetch(base,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});const body=await r.json().catch(()=>({}));if(!r.ok)throw Error(body.error||'Request failed ('+r.status+')');return body}
function state(t){$('status').textContent=t}
$('call').onclick=async()=>{try{state('Requesting call…');const r=await request('call',{to:$('number').value.trim()});if(!r.callId)throw Error('Backend returned no callId');callId=r.callId;$('hangup').disabled=false;$('send').disabled=false;state('Call requested: '+callId)}catch(e){state(e.message)}};
$('send').onclick=async()=>{try{if(!callId)throw Error('No call');state('Sending speech…');await request('speak',{callId,text:$('words').value});state('Speech submitted to call')}catch(e){state(e.message)}};
$('hangup').onclick=async()=>{try{await request('hangup',{callId});callId=null;$('send').disabled=true;$('hangup').disabled=true;state('Call ended')}catch(e){state(e.message)}};
</script></main></html>
