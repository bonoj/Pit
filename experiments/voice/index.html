<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Voice · Pit</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111923;color:#eaf0f6;font:16px system-ui}main{max-width:560px;margin:auto;padding:24px;display:flex;flex-direction:column;gap:14px}textarea{min-height:145px;background:#182330;border:1px solid #425367;border-radius:12px;color:inherit;padding:14px;font:inherit}button{background:#293c51;border:1px solid #60768f;border-radius:10px;color:white;padding:13px;font:inherit;flex:1}button:disabled{opacity:.5}.row{display:flex;gap:10px}p{color:#aebccc;font-size:13px;margin:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#182330;padding:12px;border-radius:10px;font-size:12px;min-height:65px}
</style></head><body><main><h2>VOICE · Pit</h2><textarea id="words">Welcome to hell.</textarea><div class="row"><button id="speak">Speak</button><button id="stop">Stop</button></div><p id="status" role="status">Loading local speech engine…</p><pre id="log"></pre><p>eSpeak NG via Spellophone 0.2.1 · GPL-3.0-or-later. Synthesis happens on your device; engine and dictionary are fetched from jsDelivr on first load. No speech API or account.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@spelling-creator/spellophone@0.2.1/dist/legacy/spellophone.iife.js"></script>
<script>
const $=id=>document.getElementById(id),status=$('status'),log=$('log');
let engine=null,ready=null,ctx=null,source=null;
function state(s){status.textContent=s;log.textContent+=s+'\n';}
function stop(){if(source){try{source.stop()}catch(e){}source.disconnect();source=null}}
async function initialize(){
 if(engine)return engine;
 if(ready)return ready;
 ready=(async()=>{
  if(!window.Spellophone)throw Error('Speech library could not load. Check CDN connection.');
  const e=await Spellophone.createEspeak({cdn:'jsdelivr'});
  e.setVoice('en-us');engine=e;state('Ready · '+e.version+' · en-us');return e;
 })().catch(e=>{ready=null;state('Load failed: '+e.message);throw e});
 return ready;
}
async function speak(){
 const text=$('words').value.trim();if(!text){state('Enter text');return}
 $('speak').disabled=true;
 try{
  if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
  await ctx.resume();
  const e=await initialize();
  stop();
  state('Synthesizing '+text.length+' characters…');
  const result=e.synthesize(text);
  const buffer=ctx.createBuffer(1,result.samples.length,result.sampleRate);
  buffer.copyToChannel(Spellophone.toFloat32(result.samples),0);
  const s=ctx.createBufferSource();s.buffer=buffer;s.connect(ctx.destination);source=s;
  s.onended=()=>{if(source===s){source=null;state('Finished')}s.disconnect()};
  s.start();state('Speaking · '+(buffer.duration.toFixed(2))+' seconds');
 }catch(err){state('Speak failed: '+err.message)}
 finally{$('speak').disabled=false}
}
$('speak').onclick=speak;
$('stop').onclick=()=>{stop();state('Stopped')};
initialize().catch(()=>{});
</script></body></html>
