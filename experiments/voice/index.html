<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111923;color:#eaf0f6;font:16px system-ui}main{height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:520px;margin:auto;padding:22px}textarea{width:100%;min-height:130px;resize:none;border:1px solid #425367;background:#182330;border-radius:12px;color:inherit;padding:14px;font:inherit}button{border:1px solid #60768f;border-radius:10px;background:#293c51;color:white;padding:13px;font:inherit}p{color:#aebccc;font-size:13px}</style></head><body><main><h2>VOICE · cartridge 001</h2><textarea id="words" placeholder="Type something to say…"></textarea><button id="speak">Speak</button><p id="status">Uses browser speech synthesis. Availability depends on browser support.</p></main><script>document.querySelector('#speak').onclick=()=>{const s=document.querySelector('#status');if(!('speechSynthesis' in window)){s.textContent='Speech synthesis unavailable in this browser.';return;}const value=document.querySelector('#words').value.trim();if(!value)return;try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(value));s.textContent='Speaking…'}catch(e){s.textContent='Speech failed: '+e.message}};</script></body></html>
