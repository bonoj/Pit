<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Voice · Pit</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111923;color:#eaf0f6;font:16px system-ui}main{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:560px;margin:auto;padding:22px}h2{margin:0}textarea{width:100%;min-height:160px;resize:vertical;border:1px solid #425367;background:#182330;border-radius:12px;color:inherit;padding:14px;font:inherit}.controls{display:flex;gap:10px}button{flex:1;border:1px solid #60768f;border-radius:10px;background:#293c51;color:white;padding:13px;font:inherit}button:disabled{opacity:.5}audio{width:100%}p{color:#aebccc;font-size:13px;line-height:1.5}#status{min-height:2.8em}
</style></head><body><main><h2>VOICE · cartridge 001</h2><textarea id="words" placeholder="Type something to say…">Welcome to hell.</textarea><div class="controls"><button id="speak">Speak</button><button id="stop">Stop</button></div><audio id="player" controls preload="none"></audio><p id="status" role="status">Ready to test OpenTTS.</p><p id="details">OpenTTS · remote API experiment · errors shown explicitly</p></main>
<script>
const statusEl=document.querySelector('#status'),button=document.querySelector('#speak'),player=document.querySelector('#player');
let url=null,controller=null;
function state(s){statusEl.textContent=s;}
button.onclick=async()=>{
 const text=document.querySelector('#words').value.trim();if(!text){state('Enter some text.');return;}
 controller?.abort();controller=new AbortController();const active=controller;button.disabled=true;player.pause();
 try{
  state('Requesting audio from OpenTTS…');
  const response=await fetch('https://www.opentexttospeech.com/api/v1/tts',{
   method:'POST',mode:'cors',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({text,voice:'voice-107',pitch:0,speed:0,volume:100,format:'mp3'}),
   signal:active.signal
  });
  const type=response.headers.get('content-type')||'';
  if(!response.ok)throw new Error('HTTP '+response.status+': '+(await response.text()).slice(0,240));
  if(!type.includes('audio/')&&!type.includes('octet-stream'))throw new Error('Unexpected response ('+type+'): '+(await response.text()).slice(0,240));
  const blob=await response.blob();if(!blob.size)throw new Error('Empty audio response.');
  if(active!==controller)return;
  if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);player.src=url;
  state('Received '+Math.round(blob.size/1024)+' KB · playing.');
  await player.play();
 }catch(e){
  if(active===controller&&e.name!=='AbortError')state('OpenTTS failed: '+e.message+(e instanceof TypeError?' (network/CORS or endpoint unavailable)':''));
 }finally{if(active===controller)button.disabled=false;}
};
document.querySelector('#stop').onclick=()=>{controller?.abort();controller=null;button.disabled=false;player.pause();player.currentTime=0;state('Stopped.');};
player.onended=()=>state('Finished.');
window.addEventListener('pagehide',()=>{controller?.abort();if(url)URL.revokeObjectURL(url);});
</script></body></html>
