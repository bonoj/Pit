<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Voice · Pit</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111923;color:#eaf0f6;font:16px system-ui}main{max-width:560px;margin:auto;padding:24px;display:flex;flex-direction:column;gap:14px}textarea{min-height:140px;background:#182330;border:1px solid #425367;border-radius:12px;color:inherit;padding:14px;font:inherit}button{background:#293c51;border:1px solid #60768f;border-radius:10px;color:white;padding:13px;font:inherit;flex:1}.row{display:flex;gap:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#182330;padding:12px;border-radius:10px;font-size:12px}p{color:#aebccc;font-size:13px}
</style></head><body><main><h2>VOICE · native diagnostic</h2><textarea id="words">Welcome to hell.</textarea><div class="row"><button id="speak">Speak (default)</button><button id="stop">Stop</button></div><p id="status" role="status">Ready. No downloads, APIs or selected voices.</p><pre id="log"></pre></main>
<script>
const synth=window.speechSynthesis,log=document.querySelector('#log'),status=document.querySelector('#status');
let current=null,timeout=null;
function report(s){log.textContent+=new Date().toLocaleTimeString()+' '+s+'\n';}
function state(s){status.textContent=s;report(s);}
function clear(){if(timeout)clearTimeout(timeout);timeout=null;}
report('speechSynthesis: '+Boolean(synth));
report('userAgent: '+navigator.userAgent);
report('secureContext: '+window.isSecureContext);
if(synth){report('voices now: '+synth.getVoices().length);synth.addEventListener('voiceschanged',()=>report('voiceschanged: '+synth.getVoices().length+' voices'));}
document.querySelector('#speak').onclick=()=>{
 if(!synth){state('Web Speech API unavailable');return;}
 clear();synth.cancel();
 const text=document.querySelector('#words').value.trim();if(!text){state('Enter text');return;}
 const u=new SpeechSynthesisUtterance(text);current=u;
 u.onstart=()=>{if(current===u)state('Started speaking');};
 u.onend=()=>{if(current===u){clear();state('Finished speaking');}};
 u.onerror=e=>{if(current===u){clear();state('Speech error: '+e.error);}};
 u.onpause=()=>report('Paused');u.onresume=()=>report('Resumed');
 state('Calling speak() with default voice');
 try{synth.speak(u);report('after speak(): pending='+synth.pending+' speaking='+synth.speaking+' paused='+synth.paused);}
 catch(e){state('Exception: '+e.message);return;}
 timeout=setTimeout(()=>{if(current===u)state('Timeout (10s): pending='+synth.pending+' speaking='+synth.speaking+' paused='+synth.paused)},10000);
};
document.querySelector('#stop').onclick=()=>{clear();current=null;synth?.cancel();state('Stopped');};
</script></body></html>
